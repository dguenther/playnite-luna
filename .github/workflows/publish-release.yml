name: Publish release
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Prepared X.Y.Z version (run from default branch)
        required: true
        type: string
      candidate_id:
        description: Tested candidate ID from successful Prepare release summary
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-v${{ inputs.expected_version }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and publish attached candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: python tools/Release/release.py publish --version "$EXPECTED_VERSION"
