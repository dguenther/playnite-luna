name: Validate catalog probe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore AmazonLuna.sln --locked-mode
      - run: dotnet build AmazonLuna.sln --no-restore --configuration Release
      - run: dotnet test tests/LunaCatalog.Tests/LunaCatalog.Tests.csproj --no-build --configuration Release
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/LunaBrowserEvidence/requirements.txt
      - run: python -m pip install -r tools/LunaBrowserEvidence/requirements.txt
      - run: python -m unittest discover -s tools/LunaBrowserEvidence -v
